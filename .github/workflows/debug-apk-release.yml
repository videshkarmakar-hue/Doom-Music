name: In-App Update Publisher

# Every push builds a fresh debug APK and publishes it as a versioned, non-prerelease
# GitHub release with the APK attached. The app's updater reads this repo's releases,
# so the build that ships here is the one "Check for update" offers and installs in-app.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: in-app-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build the next debug build and publish it
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses so Gradle can fetch what it needs
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # the same key on every run, so a new build installs over the previous one
      - name: Restore or create the update signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.UPDATE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Restored the repository's update key."
          else
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "No UPDATE_KEYSTORE_BASE64 secret, generated a fresh key (installs over an app only if it was signed the same way)."
          fi

      # the app compares the release's version and build number against what is installed,
      # so every push has to carry a build number higher than the last published one
      - name: Work out the next build number
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/' | sed 's/ build#.*//')
          CURRENT=$(grep -oE 'build#[0-9]+' app/build.gradle.kts | head -n 1 | tr -dc '0-9')
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].name' 2>/dev/null \
            | sed -n 's/.*build#\([0-9]*\).*/\1/p' | sort -n | tail -n 1)
          NEXT=$(( ${PUBLISHED:-0} > ${CURRENT:-0} ? ${PUBLISHED:-0} : ${CURRENT:-0} ))
          NEXT=$(( NEXT + 1 ))
          sed -i "s/versionName = \".*\"/versionName = \"$BASE build#$NEXT\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $NEXT/" app/build.gradle.kts
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          grep -n 'versionCode\|versionName' app/build.gradle.kts

      - name: Build fresh clean arm64 debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: ./gradlew clean assembleArm64FossDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Prepare the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/arm64Foss/debug -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then
            echo "No arm64 debug APK was produced." >&2
            exit 1
          fi
          # "arm64" in the name is what the app's asset picker matches for this ABI
          NAME="Doom-Music-arm64-debug-b${{ steps.ver.outputs.next }}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      # a plain release, not a prerelease: the app's default channel only reads plain releases
      - name: Publish the release the app will find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.ver.outputs.base }}
          NEXT: ${{ steps.ver.outputs.next }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          TAG="v$BASE-b$NEXT"
          TITLE="Doom Music $BASE build#$NEXT"

          cat > notes.md <<EOF
          Fresh **debug** APK for \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`.

          | | |
          |---|---|
          | Version | $BASE build#$NEXT |
          | Package | \`com.videshkarmakar.doom.debug\` |
          | ABI | arm64-v8a (mobile) |
          | Flavor | \`arm64Foss\` |
          | Size | $APK_SIZE |
          | SHA-256 | \`$APK_SHA\` |

          ### In-app update
          The app's **Settings → App update → Check for update** reads this release and installs
          \`$APK_NAME\` directly, without opening a browser.

          ### Install by hand
          \`\`\`
          adb install -r $APK_NAME
          \`\`\`

          [Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          gh release create "$TAG" "$APK_NAME" \
            -R "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

          echo "Published $TITLE -> https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
